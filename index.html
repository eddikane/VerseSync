<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseSync</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<header>
    <h1>Versesync</h1>
</header>

<main>
    <section id="this-week">
       <h2 id="week-title">This Week</h2>
       <p id="week-reading"></p>

        <!-- Opens the current week's scripture reading in Gospel Library -->
        <a id="scripture-link" href="#" target="_blank">
            Come, Follow Me
        </a>


       <nav>
            <button type="button" id="previous-week">Previous Week</button>
            <button type="button" id="next-week">Next Week</button>
       </nav>
    </section>

    <section id="share-insight">
        <h2>Share An Insight</h2>

        <form id="insight-form">
            <label for="name">Name</label>
            <input id="name" type="text">

            <label for="scripture_reference">Scripture Reference</label>
            <input id="scripture_reference" type="text">

            <label for="insight">Insight</label>
            <textarea id="insight"></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

    <section id="insights">
        <h2>Insights</h2>

        <div id="insights-list"></div>
    </section>
    <script src="script.js"></script>
</main>

<footer>
    <p>Study Together</p>
</footer>
