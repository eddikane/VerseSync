<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Sets the character encoding so normal text and special characters display correctly -->
    <meta charset="UTF-8">

    <!-- Makes the page scale correctly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Text displayed in the browser tab -->
    <title>VerseSync</title>


    <!-- =====================================================
         GOOGLE FONTS
         ===================================================== -->

    <!--
    Preconnect helps the browser connect to Google's font servers
    a little earlier so the fonts can load faster.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
    Loads the two fonts used throughout VerseSync:
    - Google Sans for general text
    - Playfair Display for headings
    -->
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet"
    >


    <!-- Loads the site's custom CSS after the Google Fonts -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =====================================================
         PAGE HEADER
         ===================================================== -->

    <header>
        <!-- Main website title -->
        <h1>VerseSync</h1>
    </header>


    <!-- =====================================================
         MAIN WEBSITE CONTENT
         ===================================================== -->

    <main>


        <!-- =================================================
             CURRENT WEEK SECTION
             ================================================= -->

        <!--
        Displays the currently selected study week's:
        - date range
        - scripture reading
        - Come, Follow Me link
        - previous/next navigation buttons

        JavaScript updates this section whenever currentWeek changes.
        -->
        <section id="this-week">

            <!-- JavaScript replaces this with the current week's date range -->
            <h2 id="week-title">This Week</h2>

            <!-- JavaScript inserts the current week's scripture reading here -->
            <p id="week-reading"></p>


            <!--
            Opens the Come, Follow Me reading for the selected week.

            JavaScript dynamically changes the href so the link
            always matches the week currently being viewed.
            -->
            <a id="scripture-link" href="#" target="_blank">
                Come, Follow Me
            </a>


            <!--
            Navigation buttons used by JavaScript to move
            backward and forward through studyWeeks.
            -->
            <nav>
                <button type="button" id="previous-week">
                    Previous Week
                </button>

                <button type="button" id="next-week">
                    Next Week
                </button>
            </nav>

        </section>



        <!-- =================================================
             SHARE AN INSIGHT SECTION
             ================================================= -->

        <!--
        Allows the user to create a new scripture insight.

        JavaScript listens for this form's submit event,
        creates an insight object, saves it, and displays it.
        -->
        <section id="share-insight">

            <h2>Share An Insight</h2>


            <!--
            The form ID lets JavaScript attach a submit event listener.
            -->
            <form id="insight-form">


                <!--
                The label's "for" value matches the input's ID.
                This connects the label to the correct form field.
                -->
                <label for="name">Name</label>
                <input id="name" type="text">


                <!-- Scripture reference associated with the user's insight -->
                <label for="scripture_reference">
                    Scripture Reference
                </label>

                <input id="scripture_reference" type="text">


                <!--
                Textarea is used instead of a normal input because
                an insight may contain multiple sentences or paragraphs.
                -->
                <label for="insight">Insight</label>
                <textarea id="insight"></textarea>


                <!--
                Because this button is type="submit", clicking it
                triggers the insight form's submit event in JavaScript.
                -->
                <button type="submit">
                    Submit
                </button>

            </form>

        </section>



        <!-- =================================================
             INSIGHTS SECTION
             ================================================= -->

        <section id="insights">

            <h2>Insights</h2>


            <!--
            JavaScript dynamically inserts insight cards inside this div.

            The HTML does not contain hard-coded insight cards because
            they are created from the insights array in script.js.
            -->
            <div id="insights-list"></div>

        </section>

    </main>



    <!-- =====================================================
         PAGE FOOTER
         ===================================================== -->

    <footer>
        <p>VerseSync</p>
    </footer>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <!--
    Loads the JavaScript after the HTML content.

    This allows JavaScript to safely find the HTML elements
    using document.querySelector().
    type="module" loads script.js as a module so Firebase imports can be used -->
    
    <script type="module" src="script.js"></script>

</body>

</html>
